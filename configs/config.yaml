# Experiment
experiment:
  name: "zsl-cwgan-gp"
  seed: 42
  device: "cuda"  # Options: "cuda", "cpu"

# Paths
paths:
  data_root: "./data"
  results_dir: "./results"
  checkpoints_dir: "./checkpoints"
  cache_dir: "./cache"
  tensorboard_dir: "./runs"

# Dataset
dataset:
  name: "CIFAR100"
  num_classes: 100
  seen_classes: 80
  unseen_classes: 20
  image_size: 32
  num_workers: 2

# Semantic Embeddings
embeddings:
  type: "clip"  # Options: "clip", "glove", "both", "clip_ensemble"
  clip_model: "openai/clip-vit-large-patch14"  # Upgraded to ViT-L/14 (768-dim)
  clip_models_ensemble:
    - "openai/clip-vit-base-patch32"      # 512-dim
    - "openai/clip-vit-large-patch14"     # 768-dim
  clip_cache_dir: "./cache/clip"
  embedding_dim: 768  # ViT-L/14 dimension
  normalize: true  # Normalize embeddings
  
  # GloVe (legacy, for comparison)
  glove_path: "glove.6B.300d.txt"
  glove_dim: 300

# Model Architecture
model:
  # Generator
  generator:
    nz: 128  # Latent dimension
    ngf: 64  # Base channel multiplier
    nc: 3    # Image channels
    semantic_proj_dim: 256  # Projection dimension for semantic features
    dropout: 0.2
    use_spectral_norm_semantic: true  # Spectral norm on semantic projection MLP
    use_adain: false  # AdaIN instead of BatchNorm (experimental)
    attention_resolutions: [8, 16]  # Self-attention at 8x8 and 16x16
    noise_injection: false  # StyleGAN-style noise injection
  
  # Discriminator
  discriminator:
    ndf: 64  # Base channel multiplier
    nc: 3
    semantic_proj_dim: 256
    use_feature_matching: true  # Enable feature matching loss
    use_auxiliary_classification: false  # AC-GAN style auxiliary head
    num_aux_classes: 80  # Number of seen classes for aux head

  # ZSL/GZSL Classifier
  classifier:
    backbone: "resnet18"  # Options: "resnet18", "efficientnet_b0", "custom"
    pretrained: true
    freeze_backbone: false
    dropout: 0.5
    hidden_dim: 512

training:
  # Basic
  num_epochs: 150
  batch_size: 128
  mixed_precision: true               # FP16 for ~2x speedup on Tensor Cores

  # Optimization - TTUR: D LR > G LR
  lr_g: 0.0001
  lr_d: 0.0004  # 4x G LR (Two-Time-Scale Update Rule)
  beta1: 0.0
  beta2: 0.9

  # WGAN-GP
  lambda_gp: 10
  n_critic: 5
  grad_clip: 1.0
  feature_matching_weight: 0.1  # Discriminator feature matching loss weight

  # Scheduler - Cosine Annealing with Warmup
  scheduler: "cosine_warmup"  # Options: "exponential", "cosine_warmup"
  lr_decay: 0.995  # For exponential
  warmup_epochs: 5
  min_lr: 1e-6

  # Gradient Penalty Scheduling
  lambda_gp_schedule: false  # Increase lambda_gp over training
  lambda_gp_final: 20
  lambda_gp_ramp_epochs: 50

  # EMA (Exponential Moving Average)
  use_ema: true
  ema_decay: 0.999
  ema_start_epoch: 10

  # Checkpointing
  save_interval: 10
  eval_interval: 10

  early_stopping_patience: 20

  # Gradient Accumulation (for effective larger batch sizes)
  gradient_accumulation_steps: 1

evaluation:
  # GAN Metrics
  fid_samples: 20000  # Number of samples for FID calculation
  calculate_is: true
  calculate_kid: true
  use_clean_fid: false  # Use clean-fid if available
  
  # ZSL/GZSL Metrics
  synthetic_samples_per_class: 2000
  zsl_epochs: 50
  zsl_lr: 0.001
  zsl_batch_size: 128
  zsl_regenerate_every: 1       # Regenerate synthetic data every N ZSL epochs (1 = every epoch)
  zsl_mixup_alpha: 0.2          # Mixup alpha (0 = disabled)
  zsl_label_smoothing: 0.1      # Label smoothing for CrossEntropyLoss
  
  # GZSL Specific
  gzsl:
    enabled: true
    calibration: "learned_temperature"  # Options: "none", "fixed", "learned_temperature"
    calibration_temperature: 1.0  # Fixed temperature if calibration="fixed"
    seen_weight: 1.0  # Weight for seen class loss
    unseen_weight: 1.0  # Weight for unseen class loss
    harmonic_mean: true  # Report harmonic mean of seen/unseen accuracy
    pseudo_labeling: false  # Iterative pseudo-labeling on real unseen
    pseudo_label_threshold: 0.9  # Confidence threshold for pseudo-labels

logging:
  use_tensorboard: true
  use_wandb: false               # Set true if using W&B
  wandb_project: "zsl-cwgan-gp"
  wandb_entity: null             # Your W&B username
  log_interval: 50               # Log every N iterations
  save_samples: true